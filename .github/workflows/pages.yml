name: Validate and deploy Kids Bank

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/data-store.js
          node --check js/banking-client.js
          node --check js/guardian-portal.js
          node --check js/supabase-config.js

      - name: Run Kids Bank tests
        run: node --test tests/registration.test.cjs tests/banking-client.test.cjs tests/guardian-banking-migration.test.cjs

      - name: Generate Supabase public client config
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node -e "const fs=require('node:fs');const key=process.env.SUPABASE_PUBLISHABLE_KEY||'';if(key){if(key.startsWith('sb_secret_'))throw new Error('A Supabase secret key cannot be published');if(!key.startsWith('sb_publishable_')){const parts=key.split('.');if(parts.length!==3)throw new Error('Use a Supabase publishable key or legacy anon JWT');const claims=JSON.parse(Buffer.from(parts[1],'base64url').toString());if(claims.role!=='anon')throw new Error('Only an anon JWT may be used as the browser key');}}fs.writeFileSync('js/supabase-config.js', 'window.KIDS_BANK_SUPABASE_CONFIG = '+JSON.stringify({url:'https://rgdtshdtrwoqcjtmzygo.supabase.co',publishableKey:key})+';');"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r css js data site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
